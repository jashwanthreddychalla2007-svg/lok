services:
  # 1. Render Static Site Configuration (Recommended)
  - type: web
    name: nexvault-static
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ENABLE_DEV_FALLBACK
        value: "true"

  # 2. Render Web Service (Node.js) Alternative Configuration
  - type: web
    name: nexvault-web-service
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: VITE_ENABLE_DEV_FALLBACK
        value: "true"
